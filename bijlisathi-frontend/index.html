<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1B33" />
    <title>BijliSathi — Kanpur Power Grid</title>
    <!-- Fonts — Sora/IBM non-blocking; Material Symbols blocked-hide to avoid WAVE FOUT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <!-- Material Symbols: display=block + preload hide. If font is still loading, ligature text is hidden (not flashed as WAVE). SVG for 'waves' is always visible. -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&family=IBM+Plex+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
      <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
    </noscript>
    <style>
      /* Fallback hide until fonts API adds .fonts-loaded — prevents WAVE flash on very slow/failed loads */
      html:not(.fonts-loaded) .material-symbols-outlined { visibility: hidden; }
    </style>
    <script>
      (function () {
        // Mark fonts ready for CSS above; also works if fonts already cached
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () { document.documentElement.classList.add('fonts-loaded'); });
          // Safety timeout — if font fetch hangs, show icons anyway clipped to 1em (won't spill as WAVE)
          setTimeout(function () { document.documentElement.classList.add('fonts-loaded'); }, 3000);
        } else {
          document.documentElement.classList.add('fonts-loaded');
        }
        // Also listen for stylesheet load as extra signal
        var msLink = document.querySelector('link[href*="Material+Symbols+Outlined"]');
        if (msLink) msLink.addEventListener('load', function(){ document.documentElement.classList.add('fonts-loaded'); });
      })();
    </script>
    <style>
      #bs-boot { position: fixed; inset: 0; background: #FAF7F0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'IBM Plex Sans', system-ui, sans-serif; z-index: 9999; }
      #bs-boot .logo { font-family: 'Sora', system-ui, sans-serif; font-weight: 700; font-size: 26px; color: #0A1B33; letter-spacing: -0.5px; }
      #bs-boot .logo span { color: #F2A93B; }
      #bs-boot .spin { width: 44px; height: 44px; margin: 22px 0 14px; border: 4px solid #E5E0D5; border-top-color: #F2A93B; border-radius: 50%; animation: bsspin 0.9s linear infinite; }
      #bs-boot .msg { color: #5A6B8C; font-size: 13px; text-align: center; padding: 0 24px; line-height: 1.5; }
      #bs-boot .retry { display: none; margin-top: 16px; background: #0A1B33; color: #fff; border: 0; padding: 10px 26px; border-radius: 10px; font-size: 14px; font-weight: 600; }
      @keyframes bsspin { to { transform: rotate(360deg); } }
      #bs-err { position: fixed; inset: 0; background: #FAF7F0; display: none; flex-direction: column; align-items: center; justify-content: center; font-family: 'IBM Plex Sans', system-ui, sans-serif; z-index: 10000; text-align: center; padding: 24px; }
      #bs-err .t { color: #0A1B33; font-weight: 700; font-size: 18px; margin-bottom: 8px; }
      #bs-err .m { color: #5A6B8C; font-size: 13px; line-height: 1.6; margin-bottom: 18px; }
      #bs-err button { background: #F2A93B; color: #0A1B33; border: 0; padding: 12px 30px; border-radius: 12px; font-size: 15px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant branded boot screen (pure HTML/CSS, zero network needed) -->
      <div id="bs-boot">
        <div class="logo">Bijli<span>Sathi</span></div>
        <div class="spin"></div>
        <div class="msg" id="bs-boot-msg">Loading…</div>
        <button class="retry" id="bs-boot-retry" onclick="location.reload(true)">Reload</button>
      </div>
    </div>
    <div id="bs-err">
      <div class="t">Couldn't load properly</div>
      <div class="m">Network issue or old page version detected.<br>Tap below to reload the latest version.</div>
      <button onclick="location.reload(true)">Reload BijliSathi</button>
    </div>
    <script>
      (function () {
        var mounted = false;
        window.__BS_MOUNTED = function () { mounted = true; var b = document.getElementById('bs-boot'); if (b) b.style.display = 'none'; };
        var msg = document.getElementById('bs-boot-msg');
        var retry = document.getElementById('bs-boot-retry');
        setTimeout(function () { if (!mounted && msg) msg.textContent = 'Slow network — still loading…'; }, 8000);
        setTimeout(function () { if (!mounted && msg) msg.textContent = 'Almost there… hang on'; }, 16000);
        setTimeout(function () { if (!mounted && retry) retry.style.display = 'block'; }, 25000);
        // If app mounted but then crashed/unmounted (empty root), show recovery instead of white
        setInterval(function () {
          if (mounted) {
            var r = document.getElementById('root');
            if (r && r.childElementCount === 0) showError();
          }
        }, 1500);
        function showError() { if (!mounted) { var e = document.getElementById('bs-err'); if (e) e.style.display = 'flex'; } }
        window.addEventListener('error', function (ev) {
          if (ev && ev.target && (ev.target.tagName === 'SCRIPT' || ev.target.tagName === 'LINK')) showError();
          else if (!mounted) setTimeout(showError, 300);
        }, true);
        window.addEventListener('unhandledrejection', function () { if (!mounted) setTimeout(showError, 300); });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
